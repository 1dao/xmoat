# xmoat.cfg — every setting, with the reason next to it.
#
# Precedence is FIRST-WINS: a KEY=VAL on the command line beats
# xmoat.local.cfg (gitignored; put tokens there), which beats this file.
# Within one file the first occurrence of a key wins.

# ── where things live ────────────────────────────────────────────────────────

# Watchlist and fetched data, as JSON files. The directory is the whole of
# xmoat's state: copy it to move an installation, delete it to start over.
DATA_DIR=data

# The browser client's static files.
WEB_ROOT=web

# ── HTTP host (main.lua) ─────────────────────────────────────────────────────

# Loopback by default. Anything else is refused unless API_TOKEN is set: the
# watchlist is personal, and every refresh spends this machine's standing with
# the data source.
LISTEN_HOST=127.0.0.1
LISTEN_PORT=8688

# When set, every /api request needs "Authorization: Bearer <token>". Put it in
# xmoat.local.cfg, not here.
API_TOKEN=

# Allow a page on another origin to call the API (a phone WebView loading the
# client from its own bundle, for instance). Empty = same origin only.
CORS_ORIGIN=

# ── data sources ─────────────────────────────────────────────────────────────

# Per-request timeout. A first fetch of a stock's full valuation history is
# given up to two minutes regardless, because that endpoint has been measured
# taking most of one when busy.
NET_TIMEOUT_MS=15000

# Pause between requests within one refresh. These are public endpoints with no
# published rate limit; being slow on purpose is how an address stays unblocked.
NET_PACE_MS=200

# Route outbound requests through a proxy: socks5://, socks5h:// or http://,
# with optional user:pass@. Empty = direct.
HTTP_PROXY=

# ── daily prices ─────────────────────────────────────────────────────────────

# Where daily bars come from by default:
#   em   Eastmoney's JSON. Forward-adjusted at the source and the only one that
#        carries the turnover rate (the chip distribution needs it), but half a
#        megabyte per stock and it refuses after a couple of dozen in a row.
#   tdx  the 通达信 protocol: 14 KB of binary per stock over a connection that
#        stays open, adjusted here from the ex-rights records, no turnover.
# A watched stock is always filled from Eastmoney regardless; this is what a
# wide scan uses. See engine/tdx.lua for what the protocol is.
PRICE_SOURCE=em

# The quote servers, host:port, tried in order. These were answering when the
# client was written — a broker's public 通达信 hosts, the same ones the
# desktop client uses.
TDX_SERVERS=117.34.114.16:7709,117.34.114.27:7709,117.34.114.15:7709,117.34.114.17:7709,117.34.114.20:7709

# How many connections may be open at once, and therefore how many stocks are
# fetched in parallel. They are spread over TDX_SERVERS in turn rather than
# piled onto one host. Four measured 19.5 stocks a second with nothing
# dropped; thirty-two is the default because the whole market is 5,300 of them
# and the limit is round-trip latency, not this machine. Lower it if a server
# starts refusing — that is what the failure list in a prefetch is for.
TDX_CONNECTIONS=32
TDX_CONNECT_MS=5000
TDX_TIMEOUT_MS=10000

# How many trading days of daily bars are kept per security. Four years or so:
# enough for a 250-day average, a chip distribution and a backtest over more
# than one cycle, and about 250 KB of JSON. 0 keeps everything the source has.
QUOTE_MAX_DAYS=1200

# How old a cached series may be before a read fetches the missing days. This
# only applies when there could be something new at all: engine/calendar.lua
# answers that first and says no all weekend, all evening and all through a
# holiday. The age limit then decides during a session, when the day's own bar
# is still moving. 0 fetches on every read.
QUOTE_TTL_MIN=180

# ── analysis ─────────────────────────────────────────────────────────────────

# Reverse DCF assumptions, in percent. Shown next to every result, because the
# implied growth means nothing without them.
DCF_DISCOUNT_RATE=10
DCF_TERMINAL_GROWTH=3
DCF_YEARS=10

# ── the breakout rule ────────────────────────────────────────────────────────

# 均线走平之后，股价放到均线上方一定幅度就是一次信号。这几个数字是网格拟合的
# 结果，不是定论：strategy.sweep 在 5254 只股票、五年、105 组参数上跑出来，
# 40 日均线（8 周）+ 突破 3%、走平容忍 1%（看前 5 周）的 60 日中位数收益比
# 「同期随便哪天买」高 2.6 个百分点，胜率高 7 个点。
#
# 试过的两个替代：要求横盘满 10 周（BREAKOUT_FLAT_LOOKBACK=50）是 +3.0 和 +7，
# 一样好但信号少一半；最初的 10 周均线 + 6%（50 / 6）也是正的，约 +1.4。
# 也就是说：真正带来超额的是把突破门槛降下来，不是把横盘拉长。
#
# 改这些值之前先跑一次 strategy.sweep，并在这里写明是哪一次网格的结论。
BREAKOUT_MA_DAYS=40
BREAKOUT_ABOVE_PCT=3
BREAKOUT_FLAT_MAX=1
BREAKOUT_FLAT_LOOKBACK=25

# 另外可以要求信号当天自己也涨够多少（「大涨突破」的另一种读法）。0 = 不要求。
BREAKOUT_MIN_DAY_GAIN=0

# ── the built-in rule, every day ─────────────────────────────────────────────

# 每个交易日收盘后的检查（SCHEDULE_TIMES）顺带用上面这条规则跑一遍全市场：只找突破的
# 第一天（和拟合时一样，两次信号至少隔 BACKTEST_COOLDOWN 个交易日），新发现的记进
# data/signals.json，推送里只带新加入的。行情走通达信，第一次一两分钟，之后十几秒。
# 0 = 不跑；网页「筛选 → 内置规则」用默认参数扫描时仍然会记录。
SIGNALS_DAILY=1

# 每次看最近几个交易日。错过一次检查（服务没开，或把假日当成了交易日）时，期间的突破
# 下一次仍然找得到；同一只同一天只记一次，窗口重叠不会重复。
SIGNALS_DAYS=3

# 信号记录保留多久，按信号日、自然日。0 = 一直保留。
SIGNALS_KEEP_DAYS=180

# 一条推送里最多列几只，按 ROE 从高到低：这是一个挑公司的工具，突破问的是一家本来
# 就值得持有的公司的价格。其余的只报数量，到网页看。企业微信应用消息一共 2000 字节。
SIGNALS_PUSH_MAX=10

# ── backtest ─────────────────────────────────────────────────────────────────

# Defaults for backtest.run, all overridable per call. The take profit and
# stop loss are walked on each day's high and low; a day that touches both
# counts as the stop, because daily bars cannot say which came first.
BACKTEST_TAKE_PROFIT=20
BACKTEST_STOP_LOSS=10
BACKTEST_HORIZON=250

# Trading days between two signals. Without it a rule that stays true for a
# month counts as twenty signals and every statistic is that month repeated.
BACKTEST_COOLDOWN=20

# Where a wide scan gets its bars. tdx can answer hundreds of stocks over a
# few open connections; em is Eastmoney, one slow request at a time.
STRATEGY_PRICE_SOURCE=tdx

# Pause between stocks when a strategy sweep or scan has to fetch their bars
# from Eastmoney (the TDX path is parallel and needs no pacing).
# Much slower than NET_PACE_MS on purpose: a stock the cache has never seen
# needs its whole history, and the quote server drops connections when those
# arrive back to back. A warm universe never waits at all.
STRATEGY_PACE_MS=1500

# How long the region map (which province a company is registered in) is kept
# before it is fetched again. It changes when a company moves its registration,
# which is to say almost never.
REGION_TTL_DAYS=30

# ── daily review ─────────────────────────────────────────────────────────────

# The indices the review reports, comma-separated: 000001 上证指数,
# 399001 深证成指, 399006 创业板指, 000300 沪深300. They are cached like any
# other daily series.
REVIEW_INDEXES=000001,399001,399006,000300

# Which of them the regime label is computed on. 沪深300 rather than the
# Shanghai Composite: it is the broader measure of the same market.
REVIEW_REGIME_INDEX=000300

# How old the board table may be before the review fetches it again.
REVIEW_SECTOR_TTL_MIN=30

# ── buy, stop and target levels ──────────────────────────────────────────────

# The valuation anchor: percentiles of this stock's OWN history for the metric
# its template uses (PE, or PB for banks, insurers and brokers). The buy range
# runs between the two lower ones, the target is the upper one. A watchlist
# band overrides the buy and target ends — that is the point of setting one.
LEVEL_BUY_LOW_PCTL=10
LEVEL_BUY_PCTL=25
LEVEL_TARGET_PCTL=70

# The stop sits this far below the nearest support under the price (MA250,
# MA120, MA60, the lower edge of the chip distribution or the 250-day low): a
# level everyone can see is one that gets pierced before it holds.
LEVEL_STOP_BUFFER=3

# ── alerts ───────────────────────────────────────────────────────────────────

# The daily check: refresh every watched stock, record what changed, push it.
# Only the HTTP host (main.lua) runs it; the CLI never does.
SCHEDULE_ENABLED=1

# Wall-clock times at SCHEDULE_UTC_OFFSET, comma-separated. After the A-share
# close, with time for the data source to publish the day's valuation.
SCHEDULE_TIMES=17:30

# 1 = Monday ... 7 = Sunday; ranges and lists both work (1-5, 1,3,5).
SCHEDULE_WEEKDAYS=1-5

# Hours from UTC for the times above. +8 is Beijing, whatever timezone the
# machine itself is set to.
SCHEDULE_UTC_OFFSET=8

# Whether the daily check pushes the market review as well:
#   digest  append it to a digest that is going out anyway (default)
#   always  send it every check, even when nothing changed — a daily ritual
#   off     never
# Default is digest because a routine message every trading day is the thing
# this tool set out not to be; `always` is there for people who want it.
PUSH_REVIEW=digest

# A valuation percentile crossing into these zones is an alert (all-history PE,
# or PB for banks). Crossing INTO the zone only: staying there is not news.
ALERT_PERCENTILE_LOW=10
ALERT_PERCENTILE_HIGH=90

# Push channels. A channel is on when its keys are set. These hold credentials,
# so set them in xmoat.local.cfg (see xmoat.local.cfg.example), not here.
WECOM_WEBHOOK_URL=
# The WeCom app channel, which reaches a member directly instead of a group.
# All three are needed: the company, its secret for this application, and the
# application's id. WECOM_TO_USER takes member ids separated by |; @all is
# everyone the application is visible to.
WECOM_CORP_ID=
WECOM_CORP_SECRET=
WECOM_AGENT_ID=
WECOM_TO_USER=@all
# The app's callback URL, which exists to unlock one field in WeCom's console:
# a company must declare its trusted IPs before the app channel will answer
# from an address outside mainland China, and the console will not open that
# field until the application has a callback URL it has verified. Set the Token
# and EncodingAESKey from the console's 「API接收消息」 page (in
# xmoat.local.cfg, they are credentials) and the route appears; leave them
# empty and nothing is served. The path must be reachable from WeCom, which
# means LISTEN_HOST=0.0.0.0, an open port, and therefore API_TOKEN.
WECOM_CALLBACK_TOKEN=
WECOM_CALLBACK_AES_KEY=
WECOM_CALLBACK_PATH=/wecom/callback
FEISHU_WEBHOOK_URL=
FEISHU_SECRET=
DINGTALK_WEBHOOK_URL=
DINGTALK_SECRET=
TELEGRAM_BOT_TOKEN=
TELEGRAM_CHAT_ID=
# Telegram is unreachable directly from mainland China; a proxy just for it
# leaves the data source on a direct connection.
TELEGRAM_PROXY=
TELEGRAM_API_BASE=https://api.telegram.org
# Any other receiver: gets {source, title, text, markdown, events} as JSON.
WEBHOOK_URL=
WEBHOOK_BEARER=

# ── language model (optional) ────────────────────────────────────────────────

# Off until LLM_PROVIDER and LLM_API_KEY are set. Used only for the reading of
# a company's own words — the numbers are always the engine's.
#
#   anthropic  Claude's Messages API. Default model claude-opus-5. The answer
#              is constrained by a JSON schema, which this API enforces.
#   openai     any OpenAI-compatible endpoint (DeepSeek, Qwen, Moonshot, a local
#              Ollama). LLM_MODEL is required; JSON is asked for, not enforced.
#
# The key belongs in xmoat.local.cfg.
LLM_PROVIDER=
LLM_API_KEY=
LLM_MODEL=
LLM_BASE_URL=
LLM_MAX_TOKENS=16000
# Generous on purpose: a reasoning model working through a company's facts has
# been measured at over two and a half minutes for one reading.
LLM_TIMEOUT_MS=300000
LLM_PROXY=

# Claude only: low | medium | high | xhigh | max. Empty uses the API default.
LLM_EFFORT=

# Claude only: on a safety decline, the API re-runs the request on a fallback
# model inside the same call instead of returning the refusal. Turn this off
# for an endpoint that is not Anthropic's own API, which will reject it.
LLM_FALLBACKS=1

# Generate a reading automatically when a watched stock publishes an annual
# report, and include it in that check's push. One model call per such report.
INSIGHT_ON_ANNUAL_REPORT=1

# ── runtime ──────────────────────────────────────────────────────────────────

# Lock the global table after startup, so a mistyped name raises instead of
# reading nil.
STRICT_GLOBALS=1

# How often the coroutine scheduler checks waiters, in milliseconds.
SCHED_TICK_MS=20
