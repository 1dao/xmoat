# xmoat.cfg — every setting, with the reason next to it.
#
# Precedence is FIRST-WINS: a KEY=VAL on the command line beats
# xmoat.local.cfg (gitignored; put tokens there), which beats this file.
# Within one file the first occurrence of a key wins.

# ── where things live ────────────────────────────────────────────────────────

# Watchlist and fetched data, as JSON files. The directory is the whole of
# xmoat's state: copy it to move an installation, delete it to start over.
DATA_DIR=data

# The browser client's static files.
WEB_ROOT=web

# ── HTTP host (main.lua) ─────────────────────────────────────────────────────

# Loopback by default. Anything else is refused unless API_TOKEN is set: the
# watchlist is personal, and every refresh spends this machine's standing with
# the data source.
LISTEN_HOST=127.0.0.1
LISTEN_PORT=8688

# When set, every /api request needs "Authorization: Bearer <token>". Put it in
# xmoat.local.cfg, not here.
API_TOKEN=

# Allow a page on another origin to call the API (a phone WebView loading the
# client from its own bundle, for instance). Empty = same origin only.
CORS_ORIGIN=

# ── data sources ─────────────────────────────────────────────────────────────

# Per-request timeout. A first fetch of a stock's full valuation history is
# given up to two minutes regardless, because that endpoint has been measured
# taking most of one when busy.
NET_TIMEOUT_MS=15000

# Pause between requests within one refresh. These are public endpoints with no
# published rate limit; being slow on purpose is how an address stays unblocked.
NET_PACE_MS=200

# Route outbound requests through a proxy: socks5://, socks5h:// or http://,
# with optional user:pass@. Empty = direct.
HTTP_PROXY=

# ── analysis ─────────────────────────────────────────────────────────────────

# Reverse DCF assumptions, in percent. Shown next to every result, because the
# implied growth means nothing without them.
DCF_DISCOUNT_RATE=10
DCF_TERMINAL_GROWTH=3
DCF_YEARS=10

# ── alerts ───────────────────────────────────────────────────────────────────

# The daily check: refresh every watched stock, record what changed, push it.
# Only the HTTP host (main.lua) runs it; the CLI never does.
SCHEDULE_ENABLED=1

# Wall-clock times at SCHEDULE_UTC_OFFSET, comma-separated. After the A-share
# close, with time for the data source to publish the day's valuation.
SCHEDULE_TIMES=17:30

# 1 = Monday ... 7 = Sunday; ranges and lists both work (1-5, 1,3,5).
SCHEDULE_WEEKDAYS=1-5

# Hours from UTC for the times above. +8 is Beijing, whatever timezone the
# machine itself is set to.
SCHEDULE_UTC_OFFSET=8

# A valuation percentile crossing into these zones is an alert (all-history PE,
# or PB for banks). Crossing INTO the zone only: staying there is not news.
ALERT_PERCENTILE_LOW=10
ALERT_PERCENTILE_HIGH=90

# Push channels. A channel is on when its keys are set. These hold credentials,
# so set them in xmoat.local.cfg (see xmoat.local.cfg.example), not here.
WECOM_WEBHOOK_URL=
# The WeCom app channel, which reaches a member directly instead of a group.
# All three are needed: the company, its secret for this application, and the
# application's id. WECOM_TO_USER takes member ids separated by |; @all is
# everyone the application is visible to.
WECOM_CORP_ID=
WECOM_CORP_SECRET=
WECOM_AGENT_ID=
WECOM_TO_USER=@all
# The app's callback URL, which exists to unlock one field in WeCom's console:
# a company must declare its trusted IPs before the app channel will answer
# from an address outside mainland China, and the console will not open that
# field until the application has a callback URL it has verified. Set the Token
# and EncodingAESKey from the console's 「API接收消息」 page (in
# xmoat.local.cfg, they are credentials) and the route appears; leave them
# empty and nothing is served. The path must be reachable from WeCom, which
# means LISTEN_HOST=0.0.0.0, an open port, and therefore API_TOKEN.
WECOM_CALLBACK_TOKEN=
WECOM_CALLBACK_AES_KEY=
WECOM_CALLBACK_PATH=/wecom/callback
FEISHU_WEBHOOK_URL=
FEISHU_SECRET=
DINGTALK_WEBHOOK_URL=
DINGTALK_SECRET=
TELEGRAM_BOT_TOKEN=
TELEGRAM_CHAT_ID=
# Telegram is unreachable directly from mainland China; a proxy just for it
# leaves the data source on a direct connection.
TELEGRAM_PROXY=
TELEGRAM_API_BASE=https://api.telegram.org
# Any other receiver: gets {source, title, text, markdown, events} as JSON.
WEBHOOK_URL=
WEBHOOK_BEARER=

# ── language model (optional) ────────────────────────────────────────────────

# Off until LLM_PROVIDER and LLM_API_KEY are set. Used only for the reading of
# a company's own words — the numbers are always the engine's.
#
#   anthropic  Claude's Messages API. Default model claude-opus-5. The answer
#              is constrained by a JSON schema, which this API enforces.
#   openai     any OpenAI-compatible endpoint (DeepSeek, Qwen, Moonshot, a local
#              Ollama). LLM_MODEL is required; JSON is asked for, not enforced.
#
# The key belongs in xmoat.local.cfg.
LLM_PROVIDER=
LLM_API_KEY=
LLM_MODEL=
LLM_BASE_URL=
LLM_MAX_TOKENS=16000
# Generous on purpose: a reasoning model working through a company's facts has
# been measured at over two and a half minutes for one reading.
LLM_TIMEOUT_MS=300000
LLM_PROXY=

# Claude only: low | medium | high | xhigh | max. Empty uses the API default.
LLM_EFFORT=

# Claude only: on a safety decline, the API re-runs the request on a fallback
# model inside the same call instead of returning the refusal. Turn this off
# for an endpoint that is not Anthropic's own API, which will reject it.
LLM_FALLBACKS=1

# Generate a reading automatically when a watched stock publishes an annual
# report, and include it in that check's push. One model call per such report.
INSIGHT_ON_ANNUAL_REPORT=1

# ── runtime ──────────────────────────────────────────────────────────────────

# Lock the global table after startup, so a mistyped name raises instead of
# reading nil.
STRICT_GLOBALS=1

# How often the coroutine scheduler checks waiters, in milliseconds.
SCHED_TICK_MS=20
